
name: Terraform Azure CI/CD

on:
  push:
    branches: [main]
    paths:
      - "azure-vm/**"
      - "aks-cluster/**"
      - ".github/workflows/terraform-azure.yml"

  pull_request:
    branches: [main]
    paths:
      - "azure-vm/**"
      - "aks-cluster/**"
      - ".github/workflows/terraform-azure.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-azure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

jobs:
  validate:
    name: Validate & Lint (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [azure-vm, aks-cluster]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Terraform Format Check
        working-directory: ${{ matrix.root }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        working-directory: ${{ matrix.root }}
        run: |
          tflint --init
          tflint

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Remove Trivy Envs file
        if: always()
        run: rm -f trivy_envs.txt

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: Terraform Plan (AKS)
    needs: [validate, security]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aks-cluster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify Azure OIDC Variables
        shell: bash
        run: |
          test -n "$ARM_CLIENT_ID" || {
            echo "::error::ARM_CLIENT_ID is missing"
            exit 1
          }
          test -n "$ARM_TENANT_ID" || {
            echo "::error::ARM_TENANT_ID is missing"
            exit 1
          }
          test -n "$ARM_SUBSCRIPTION_ID" || {
            echo "::error::ARM_SUBSCRIPTION_ID is missing"
            exit 1
          }
          echo "Azure OIDC variables are present."

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Create Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Export Plan
        run: |
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            aks-cluster/tfplan
            aks-cluster/tfplan.json
            aks-cluster/tfplan.txt
          if-no-files-found: error
          retention-days: 5

  apply:
    name: Terraform Apply (AKS)
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: ./aks-cluster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify Azure OIDC Variables
        shell: bash
        run: |
          test -n "$ARM_CLIENT_ID" || {
            echo "::error::ARM_CLIENT_ID is missing"
            exit 1
          }
          test -n "$ARM_TENANT_ID" || {
            echo "::error::ARM_TENANT_ID is missing"
            exit 1
          }
          test -n "$ARM_SUBSCRIPTION_ID" || {
            echo "::error::ARM_SUBSCRIPTION_ID is missing"
            exit 1
          }
          echo "Azure OIDC variables are present."

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Create Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ./aks-cluster

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
